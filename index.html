<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b20"><title>GitarrenFlow</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b20;color:#eef5f1;font:17px/1.6 system-ui}main{max-width:670px;margin:auto;padding:20px 18px 110px}h1,h2,h3{line-height:1.2}h1{font-size:30px}h2{font-size:25px}small,.muted{color:#b4c9c7}section{background:#1d3036;border:1px solid #354b50;border-radius:19px;padding:20px;margin:16px 0}button,select,input{font:inherit}button,select{border:1px solid #52716f;border-radius:12px;background:#29434a;color:#fff;padding:12px;margin:4px 0;min-height:48px;cursor:pointer}button.primary{background:#a7e8bd;color:#102b23;font-weight:750;border:0}button:focus-visible{outline:3px solid #ffc879}button.full{width:100%;text-align:left}nav{position:fixed;bottom:0;left:0;right:0;background:#18292f;display:flex;justify-content:center;padding:8px 5px calc(8px + env(safe-area-inset-bottom));gap:5px}nav button{font-size:13px;flex:1;max-width:150px;padding:8px 2px}progress{width:100%;accent-color:#a7e8bd;height:12px} .pill{display:inline-block;background:#29434a;border-radius:18px;padding:3px 12px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.keys{display:flex;gap:3px;overflow:auto}.keys button{flex:1;min-width:35px;padding:8px 3px}.keys .black{background:#0b1114;color:white}.fret{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.fret button{padding:4px;font-size:14px}svg{max-width:100%;height:auto} .good{color:#a7e8bd} .beat{font-size:36px;text-align:center;letter-spacing:10px}label{display:block}input[type=range]{width:100%;accent-color:#a7e8bd}body.light{background:#edf4ef;color:#18332e}body.light section{background:white;border-color:#b4c9c7}body.light .muted,body.light small{color:#47635b} </style><main><header><small>DEINE MUSIKSCHULE · WESTERNGITARRE</small><h1>GitarrenFlow</h1></header><div id="app"></div></main><nav id="nav"></nav><script>
const lessons=[
['Ankommen','Praxis','Setze dich aufrecht hin. Lege den Gitarrenkorpus auf den rechten Oberschenkel (bei Rechtshändern). Halte den Hals locker, ohne die Schulter hochzuziehen.','Spiele jede Saite einmal locker an. Bei Schmerzen mach eine Pause.','Wie soll die Greifhand sein?',['Locker','Verkrampft','Mit maximalem Druck'],0],
['Die sechs Saiten','Theorie','Von dick nach dünn heißen die Saiten E, A, D, G, H, E. Das H heißt international B. Die dickste Saite ist Nummer 6.','Spiele die Saiten 6 bis 1 und sprich ihre Namen. Nutze das Stimmwerkzeug als Tonreferenz.','Wie heißt Saite 2?',['A','H','G'],1],
['Dein erster Ton','Praxis','Ein Bund verkürzt den schwingenden Teil der Saite. Drücke knapp hinter dem Bundstäbchen, nicht darauf.','Spiele die tiefe E-Saite leer, dann im ersten und zweiten Bund. Höre, wie der Ton steigt.','Was passiert beim höheren Bund?',['Ton wird tiefer','Ton bleibt gleich','Ton wird höher'],2],
['Halbton und Ganzton','Theorie','Ein Bund entspricht einem Halbton. Zwei Bünde sind ein Ganzton. Zwischen E und F sowie H und C liegt nur ein Halbton.','Spiele E, F und Fis auf der tiefen E-Saite (Bünde 0, 1, 2).','Wie viele Bünde hat ein Ganzton?',['2','1','4'],0],
['Viertel und Puls','Rhythmus','Der Puls ist der gleichmäßige Grundschlag. Im 4/4-Takt zählen wir 1, 2, 3, 4. Eine Viertelnote dauert hier einen Schlag.','Starte das Metronom bei 60 BPM und spiele eine leere Saite pro Klick.','Wie viele Viertelschläge hat 4/4?',['3','4','8'],1],
['E-Moll','Praxis','Ein Moll-Dreiklang besteht aus Grundton, kleiner Terz und Quinte. E-Moll enthält E, G und H.','Greife A- und D-Saite im zweiten Bund. Alle sechs Saiten erklingen. Prüfe jede einzeln.','Welche Terz hat Moll?',['Große','Keine','Kleine'],2,'Em'],
['A-Moll','Praxis','A-Moll enthält A, C und E. Die tiefe E-Saite lassen wir beim Standardgriff aus.','Greife D2, G2 und H1. Schlage ab der A-Saite an.','Welche Saite lässt du aus?',['Tiefe E','Hohe E','A'],0,'Am'],
['Intervalle','Theorie','Ein Intervall ist der Abstand zweier Töne. Eine kleine Terz umfasst 3, eine große Terz 4, eine reine Quinte 7 Halbtöne. Eine Oktave hat 12.','Spiele auf der tiefen E-Saite Bund 0, 3, 4 und 7. Vergleiche die Abstände.','Wie viele Halbtöne hat die reine Quinte?',['5','7','12'],1],
['C-Dur','Praxis','Ein Dur-Dreiklang enthält Grundton, große Terz und reine Quinte. C-Dur besteht aus C, E, G.','Greife A3, D2, H1. Spiele ab A.','Welche Töne bilden C-Dur?',['C D E','C Es G','C E G'],2,'C'],
['D-Dur und G-Dur','Praxis','D-Dur enthält D, Fis, A. G-Dur enthält G, H, D. Beide passen zur Tonart G-Dur.','Übe D-Dur langsam, danach G-Dur im Akkordwerkzeug.','Ab welcher Saite spielst du D-Dur?',['D','A','Tiefe E'],0,'D'],
['Achtel und Pausen','Rhythmus','Zwei Achtel dauern so lange wie eine Viertel. Zähle 1 und 2 und 3 und 4 und. Eine Pause dauert ebenso lange wie ihr Notenwert.','Spiele bei 50 BPM zweimal je Klick. Lass danach jeden zweiten Schlag aus.','Wie viele Achtel ergeben eine Viertel?',['4','2','1'],1],
['Die Dur-Tonleiter','Theorie','Das Muster lautet Ganz, Ganz, Halb, Ganz, Ganz, Ganz, Halb. C-Dur: C D E F G A H C.','Spiele die weißen Tasten des Klaviers von C bis C.','Wo liegt in C-Dur ein Halbton?',['C–D','F–G','E–F'],2],
['Natürliches Moll','Theorie','A-Moll enthält A H C D E F G A. Es verwendet dieselben Töne wie C-Dur, aber A ist das tonale Zentrum.','Spiele A bis A auf dem Klavier oder Griffbrett.','Welche Dur-Tonart ist parallel zu A-Moll?',['C-Dur','G-Dur','A-Dur'],0],
['Tabulatur lesen','Theorie','TAB hat sechs Linien. Oben liegt die hohe e-Saite. Zahlen nennen den Bund, 0 bedeutet leer. Man liest von links nach rechts.','Spiele auf der hohen e-Saite 0–1–3–1–0.','Was bedeutet 0 in TAB?',['Pause','Leere Saite','Erster Bund'],1],
['Noten lesen','Theorie','Im Violinschlüssel heißen die Linien von unten E G H D F; die Zwischenräume F A C E. Gitarrennoten klingen eine Oktave tiefer als notiert.','Merke dir zunächst E auf der untersten Linie und F im ersten Zwischenraum.','Welche Note liegt auf der untersten Linie?',['C','G','E'],2],
['Akkordfolgen','Theorie','In C-Dur sind die Hauptstufen I = C, IV = F, V = G. Die VI. Stufe ist Am. Akkordfolgen schaffen Spannung und Auflösung.','Spiele zur Vorbereitung C, G, Am, Em je vier Schläge.','Welche Stufe ist G in C-Dur?',['V','I','IV'],0],
['Quintenzirkel','Theorie','Im Uhrzeigersinn folgt jeweils eine reine Quinte: C G D A E H Fis. Entgegen folgen F B Es As Des Ges. Jede benachbarte Dur-Tonart unterscheidet sich um ein Vorzeichen.','Sieh dir den Quintenzirkel im Werkzeugbereich an.','Welche Tonart folgt auf C im Uhrzeigersinn?',['F','G','D'],1],
['Pentatonik','Praxis','Die E-Moll-Pentatonik besteht aus E G A H D. Sie ist eine häufige Grundlage für Melodien und Improvisation.','Spiele auf den beiden tiefen Saiten E: 0–3 und A: 0–2–5. Das ergibt die fünf Töne.','Wie viele verschiedene Töne hat eine Pentatonik?',['7','6','5'],2],
['Deine erste Begleitung','Praxis','Eine Begleitung braucht vor allem gleichmäßigen Rhythmus. Langsame saubere Wechsel sind wichtiger als Tempo.','Spiele Em–C–G–D, jeden Akkord vier Abschläge bei 50 BPM. Wiederhole und erfinde eine Melodie.','Was ist beim Üben wichtiger?',['Gleichmäßigkeit','Maximale Geschwindigkeit','Kraft'],0]
];
const chords={Em:[0,2,2,0,0,0],Am:[-1,0,2,2,1,0],C:[-1,3,2,0,1,0],D:[-1,-1,0,2,3,2],G:[3,2,0,0,0,3],E:[0,2,2,1,0,0],A:[-1,0,2,2,2,0]};const notes=['C','Cis','D','Dis','E','F','Fis','G','Gis','A','B','H'];const tuning=[40,45,50,55,59,64];let state={done:[],minutes:0,energy:5,light:false};let storage=true;try{Object.assign(state,JSON.parse(localStorage.getItem('gflow-v1')||'{}'))}catch(e){storage=false}let page='home',current=0,answer=-1,passed=false,ac,metro=null,beat=0,earRoot=60,earAnswer=4;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('gflow-v1',JSON.stringify(state))}catch(e){storage=false}}function tone(m,d=.65,delay=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();let t=ac.currentTime+delay;for(let k=1;k<=3;k++){let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=440*2**((m-69)/12)*k;g.gain.setValueAtTime(.12/k,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}}catch(e){alert('Audio ist hier nicht verfügbar.')}}function chord(n){chords[n].forEach((f,i)=>{if(f>=0)tone(tuning[i]+f,1.3,i*.06)})}function diagram(n){let f=chords[n];return `<svg viewBox="0 0 280 190" role="img" aria-label="Akkord ${n}">${f.map((v,i)=>`<text x="${40+i*40}" y="20" fill="currentColor" text-anchor="middle" font-size="15">${v<0?'×':v===0?'○':''}</text><line x1="${40+i*40}" y1="35" x2="${40+i*40}" y2="155" stroke="currentColor"/>${v>0?`<circle cx="${40+i*40}" cy="${15+v*40}" r="12" fill="#76bc95"/>`:''}<text x="${40+i*40}" y="180" text-anchor="middle" fill="currentColor">${['E','A','D','G','H','e'][i]}</text>`).join('')}${[0,1,2,3].map(i=>`<line x1="40" y1="${35+i*40}" x2="240" y2="${35+i*40}" stroke="currentColor" stroke-width="${i===0?4:1}"/>`).join('')}</svg>`}function go(p){stopMetro();page=p;render();window.scrollTo(0,0)}function start(i){current=i;answer=-1;passed=false;go('lesson')}function next(){let i=lessons.findIndex((_,i)=>!state.done.includes(i));start(i<0?0:i)}function check(i){answer=i;passed=i===lessons[current][6];render()}function finish(){if(!passed)return;if(!state.done.includes(current)){state.done.push(current);save()}go('home')}function addTime(){state.minutes+=Number(prompt('Wie viele Minuten hast du geübt?','5'))||0;state.minutes=Math.max(0,state.minutes);save();render()}function render(){document.body.classList.toggle('light',state.light);$('nav').innerHTML=[['home','Heute'],['path','Lernpfad'],['tools','Werkzeuge'],['stats','Fortschritt']].map(([p,n])=>`<button class="${page===p?'primary':''}" onclick="go('${p}')">${n}</button>`).join('');let h='';if(page==='home'){h=`<section><span class="pill">In deinem Tempo</span><h2>Was schaffst du heute?</h2><div class="grid">${[2,5,15,30].map(n=>`<button class="${state.energy===n?'primary':''}" onclick="state.energy=${n};save();render()">${n} Min.</button>`).join('')}</div><p>${{2:'Ein Ton oder eine Frage reicht heute.',5:'Eine kleine Lektion mit Praxis und Theorie.',15:'Eine Lektion, Wiederholung und freies Üben.',30:'Mehrere Lektionen mit freiwilligen Pausen.'}[state.energy]}</p><button class="primary full" onclick="next()">Nächste Lektion starten</button></section><section><h3>Dein Lernweg</h3><progress max="${lessons.length}" value="${state.done.length}"></progress><p>${state.done.length} von ${lessons.length} Lektionen</p><button onclick="go('tools')">Frei ausprobieren</button></section>`}if(page==='path')h='<h2>Dein Lernpfad</h2>'+lessons.map((l,i)=>`<button class="full" onclick="start(${i})">${state.done.includes(i)?'✓':'○'} ${i+1}. ${l[0]}<br><small>${l[1]}</small></button>`).join('');if(page==='lesson'){let l=lessons[current];/* indices: title,type,theory,practice,question,options,correct,chord */h=`<small>Lektion ${current+1} / ${lessons.length} · ${l[1]}</small><section><h2>${l[0]}</h2><p>${l[2]}</p>${l[7]?diagram(l[7])+`<button onclick="chord('${l[7]}')">Akkord anhören</button>`:''}<h3>Jetzt du</h3><p>${l[3]}</p></section><section><h3>Mini-Wissenscheck</h3><p>${l[4]}</p>${l[5].map((a,i)=>`<button class="full ${answer===i?'primary':''}" onclick="check(${i})">${a}</button>`).join('')}<p role="status">${answer<0?'':passed?'Richtig. Wenn du die Praxis ausprobiert hast, schließe die Lektion ab.':'Noch nicht. Lies die Erklärung noch einmal und versuche es erneut.'}</p>${passed?'<button class="primary full" onclick="finish()">Lektion abschließen</button>':''}</section><button onclick="go('path')">Später weiterlernen</button>`}if(page==='tools')h=`<h2>Musikwerkzeuge</h2><section><h3>Stimmreferenz</h3><p>Spiele den Referenzton und vergleiche ihn mit deiner Saite. Kein automatisches Stimmgerät.</p><div class="grid">${tuning.map((m,i)=>`<button onclick="tone(${m},2)">${6-i}. ${notes[m%12]} · ${Math.round(440*2**((m-69)/12))} Hz</button>`).join('')}</div></section><section><h3>Metronom</h3><label>Tempo: <span id="bpmval">60</span> BPM<input id="bpm" type="range" min="40" max="160" value="60" oninput="$('bpmval').textContent=this.value;if(metro)startMetro()"></label><div class="beat" id="beat">○ ○ ○ ○</div><button onclick="startMetro()">Start</button> <button onclick="stopMetro()">Stopp</button></section><section><h3>Akkordbibliothek</h3><div class="grid">${Object.keys(chords).map(n=>`<button onclick="$('chordpic').innerHTML=diagram('${n}');chord('${n}')">${n}</button>`).join('')}</div><div id="chordpic">${diagram('Em')}</div><small>× = nicht spielen, ○ = leer. Links die dickste Saite.</small></section><section><h3>Virtuelles Klavier</h3><div class="keys">${Array.from({length:13},(_,i)=>`<button class="${[1,3,6,8,10].includes(i)?'black':''}" onclick="tone(${60+i})">${notes[i%12]}</button>`).join('')}</div></section><section><h3>Griffbrett · Bund 0–5</h3><small>Oben die dünnste Saite. Tippe auf einen Ton.</small><div class="fret">${[0,1,2,3,4,5].map(i=>`<small>Bund ${i}</small>`).join('')}${[...tuning].reverse().map(m=>Array.from({length:6},(_,i)=>`<button onclick="tone(${m+i})">${notes[(m+i)%12]}</button>`).join('')).join('')}</div></section><section><h3>Gehörtraining · Terzen</h3><p>Höre zwei Töne. Kleine oder große Terz?</p><button onclick="earRoot=55+Math.floor(Math.random()*12);earAnswer=Math.random()<.5?3:4;playEar();$('earfeedback').textContent=''">Neue Aufgabe</button> <button onclick="playEar()">Wiederholen</button><div class="grid"><button onclick="earCheck(3)">Kleine Terz</button><button onclick="earCheck(4)">Große Terz</button></div><p id="earfeedback" role="status"></p></section><section><h3>Quintenzirkel</h3><svg viewBox="0 0 280 280"><circle cx="140" cy="140" r="100" fill="none" stroke="#76bc95" stroke-width="2"/>${['C','G','D','A','E','H','Fis/Ges','Des','As','Es','B','F'].map((n,i)=>`<text x="${140+115*Math.sin(i*Math.PI/6)}" y="${145-115*Math.cos(i*Math.PI/6)}" fill="currentColor" text-anchor="middle" font-size="13">${n}</text>`).join('')}<text x="140" y="145" fill="currentColor" text-anchor="middle">Dur</text></svg><p>Rechts: mehr Kreuzvorzeichen. Links: mehr B-Vorzeichen.</p></section>`;if(page==='stats')h=`<section><h2>Dein Fortschritt</h2><h3>${state.done.length} / ${lessons.length} Lektionen</h3><progress max="${lessons.length}" value="${state.done.length}"></progress><p>${state.done.length*10} Erfahrungspunkte · ${state.minutes} freiwillig erfasste Übungsminuten</p><button onclick="addTime()">Übungszeit eintragen</button></section><section><h3>Einstellungen und Sicherung</h3><button onclick="state.light=!state.light;save();render()">${state.light?'Dunkles':'Helles'} Design</button><button onclick="backup()">Fortschritt exportieren</button><label>Sicherung importieren<input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></label><p class="muted">Deine Daten bleiben in diesem Browser. Exportiere regelmäßig eine Sicherung.</p><button onclick="if(confirm('Wirklich den Fortschritt löschen?')){state.done=[];state.minutes=0;save();render()}">Fortschritt zurücksetzen</button></section>`;$('app').innerHTML=h+(!storage?'<p>Lokaler Speicher nicht verfügbar. Exportiere deinen Fortschritt vor dem Schließen.</p>':'')}
function playEar(){tone(earRoot,.7);tone(earRoot+earAnswer,.7,.85)}function earCheck(n){$('earfeedback').textContent=n===earAnswer?'Richtig!':'Noch nicht. Höre erneut hin.'}function stopMetro(){clearInterval(metro);metro=null;if($('beat'))$('beat').textContent='○ ○ ○ ○'}function startMetro(){stopMetro();beat=0;const tick=()=>{tone(beat===0?88:81,.09);$('beat').textContent=Array.from({length:4},(_,i)=>i===beat?'●':'○').join(' ');beat=(beat+1)%4};tick();metro=setInterval(tick,60000/Number($('bpm').value))}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='gitarrenflow-fortschritt.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}async function restore(f){if(!f)return;try{let s=JSON.parse(await f.text());if(!Array.isArray(s.done)||!s.done.every(i=>Number.isInteger(i)&&i>=0&&i<lessons.length)||!Number.isFinite(s.minutes)||s.minutes<0)throw Error();state={done:[...new Set(s.done)],minutes:s.minutes,energy:[2,5,15,30].includes(s.energy)?s.energy:5,light:!!s.light};save();render()}catch(e){alert('Diese Sicherung ist ungültig.')}}render();</script></html>
